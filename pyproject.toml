[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "avis"
version = "1.0.0"
description = "AVIS — Affective Visual Intelligence System: Emotion-Aware Image Captioning"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Jeevakamal K.R.", email = "" },
    { name = "Guhan K.B." },
    { name = "Gowtham S.D." },
    { name = "Shatha Varsha Sree T." },
]
keywords = ["computer-vision", "emotion-recognition", "image-captioning", "agentic-ai"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "agents*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src", "agents", "tests", "scripts", "demo"]
extraPaths = ["."]
